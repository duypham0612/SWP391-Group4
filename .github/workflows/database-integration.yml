name: Database integration

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  sqlserver-2022:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSSQL_SA_PASSWORD: Caf3Chain!2026

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/bin/bash -c '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify x86_64 runner
        run: test "$(uname -m)" = "x86_64"

      - name: Unit and SQL Server integration tests
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress clean verify -Pintegration \
            -Dit.db.url="jdbc:sqlserver://localhost:1433;encrypt=false;trustServerCertificate=true" \
            -Dit.db.username=sa \
            -Dit.db.password="$MSSQL_SA_PASSWORD" \
            -Dit.db.initSchema=true
          status=$?
          if [ "$status" -ne 0 ]; then
            shopt -s nullglob
            reports=(target/surefire-reports/*.txt target/failsafe-reports/*.txt)
            if [ "${#reports[@]}" -eq 0 ]; then
              echo "::error title=Maven failed::No Surefire/Failsafe text reports were created."
            fi
            for report in "${reports[@]}"; do
              grep -Eq '<<< FAILURE!|Failures: [1-9]|Errors: [1-9]' "$report" || continue
              message="$(tail -n 120 "$report" | perl -0pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
              echo "::error file=$report,title=$(basename "$report")::$message"
            done
          fi
          exit "$status"

name: Database integration

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  sqlserver-2022:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify x86_64 runner
        run: test "$(uname -m)" = "x86_64"

      - name: Unit and SQL Server integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify -Pintegration
